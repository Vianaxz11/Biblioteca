{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173b35">
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="Página inicial da Biblioteca">
            <span class="brand-mark" aria-hidden="true">B</span>
            <span>Biblioteca</span>
        </a>
        <nav class="site-nav" aria-label="Navegação principal">
            <a href="/livros/">Livros</a>
            <a href="/usuarios/">Usuários</a>
            <a href="/emprestimos/">Empréstimos</a>
        </nav>
        <a class="admin-link" href="/admin/">Administração <span aria-hidden="true">↗</span></a>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <a href="/">Sistema de Biblioteca</a>
        <span>Organização para cada página.</span>
    </footer>
</body>
</html>
